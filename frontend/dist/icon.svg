<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0f0f23" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Human Figure & Motion Nodes -->
  <!-- Head -->
  <circle cx="32" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
  <!-- Torso / Spine -->
  <line x1="32" y1="21" x2="32" y2="36" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
  <!-- Left Arm (Dynamic pose) -->
  <polyline points="32,25 21,21 16,30" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Arm (Dynamic pose) -->
  <polyline points="32,25 43,21 48,16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Leg -->
  <polyline points="32,36 24,46 19,56" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Leg -->
  <polyline points="32,36 40,44 46,55" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Keypoint joint dots -->
  <circle cx="21" cy="21" r="2" fill="#c084fc" />
  <circle cx="16" cy="30" r="2" fill="#38bdf8" />
  <circle cx="43" cy="21" r="2" fill="#c084fc" />
  <circle cx="48" cy="16" r="2" fill="#38bdf8" />
  <circle cx="24" cy="46" r="2" fill="#818cf8" />
  <circle cx="40" cy="44" r="2" fill="#818cf8" />
</svg>
